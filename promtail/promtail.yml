# Promtail — сбор docker-логов на сервере приложений и доставка в Loki.
#
# Один и тот же конфиг ставится на все серверы приложений (./server/install-promtail.sh).
# На каждом таком сервере Loki доступен на 127.0.0.1:3100 через обратный SSH-туннель
# с машины мониторинга (server/tunnels/apps.service), поэтому адрес push одинаковый
# везде и не зависит от IP.
# UI promtail слушает только loopback: на 0.0.0.0 он торчит в интернет и
# отдаёт наружу внутреннее состояние сбора (его уже видно в логах со сканеров).
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # label 'container' = имя docker-контейнера (chat-backend-app-1, ...)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Не тащим агентов и служебные контейнеры (шума нет пользы).
      # monitoring-* — сам стек мониторинга: promtail запускается и на машине
      # мониторинга, где без этого фильтра он собирал бы логи самого себя.
      - source_labels: ['container']
        regex: '(promtail|loki|node_exporter|blackbox|loadtest-.*|monitoring-.*|gitlab.*)'
        action: drop
      # label 'app' для запросов {app="chat"} / {app="makeup"} / {app="wcm"}
      - source_labels: ['container']
        regex: '(chat|makeup).*'
        target_label: app
      - source_labels: ['container']
        regex: 'world-country-monitoring.*'
        target_label: app
        replacement: 'wcm'
      # Общий MinIO (отдельный проект shared-minio) — чтобы логи хранилища
      # были доступны как {app="minio"} и в дашборде Backend Logs.
      - source_labels: ['container']
        regex: 'shared-minio-minio.*'
        target_label: app
        replacement: 'minio'
      # Сервер trading: инфраструктура (trading-app/caddy/collector/postgres/redis)
      # -> {app="trading"}, а live-трейдеры (pairs-mn, donchian-*) помечены
      # docker-меткой trading.role=trader -> {app="trader"}.
      - source_labels: ['__meta_docker_container_label_trading_role']
        regex: 'trader'
        target_label: app
        replacement: 'trader'
      - source_labels: ['container']
        regex: 'trading-.*'
        target_label: app
        replacement: 'trading'
    pipeline_stages:
      # JSON-логи приложений (chat/makeup): уровень в отдельный label.
      - match:
          selector: '{app=~"chat|makeup"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
      # world-country-monitoring пишет текстовый Spring Boot лог:
      # уровень достаём регуляркой из начала строки.
      - match:
          selector: '{app="wcm"}'
          stages:
            - regex:
                expression: '^(?P<ts>\S+)\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\b'
            - labels:
                level:
      # trading и трейдеры пишут Python-лог вида
      #   2026-10-08 04:18:44,872 INFO <tracking_id> GetCandles
      - match:
          selector: '{app=~"trading|trader"}'
          stages:
            - regex:
                expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[,.]\d+)\s+(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)\b'
            - labels:
                level:
