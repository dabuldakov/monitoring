apiVersion: 1

datasources:
  - name: Loki
    uid: ds_loki
    type: loki
    access: proxy
    # Loki слушает только loopback: наружу закрыт, читает его Grafana
    # и обратный SSH-туннель с серверов приложений.
    url: http://127.0.0.1:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
