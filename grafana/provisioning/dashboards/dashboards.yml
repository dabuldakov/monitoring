apiVersion: 1

providers:
  - name: k6
    orgId: 1
    folder: k6
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/k6
      foldersFromFilesStructure: false

  - name: logs
    orgId: 1
    folder: Logs
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/logs
      foldersFromFilesStructure: false

  - name: availability
    orgId: 1
    folder: Availability
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/availability
      foldersFromFilesStructure: false