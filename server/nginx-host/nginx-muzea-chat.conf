# muzea: бэкенд чата (chat, 8086)
server {
    listen 80;
    server_name chat-muzea.su;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat-muzea.su;

    ssl_certificate     /etc/letsencrypt/live/api-muzea.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-muzea.su/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Аватары и прочие небольшие загрузки. Крупные вложения идут через
    # presigned URL напрямую в s3.muzea.su и сюда не попадают.
    client_max_body_size 25m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # Первый элемент X-Forwarded-For должен быть реальным IP клиента, а не
    # присланным им заголовком.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Legacy multipart-загрузка вложений старыми клиентами.
    location = /api/attachments/upload {
        client_max_body_size 220m;
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
    }
}
