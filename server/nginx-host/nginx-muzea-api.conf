# muzea: основной бэкенд (makeup, 8085)
server {
    listen 80;
    server_name api-muzea.su;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api-muzea.su;

    ssl_certificate     /etc/letsencrypt/live/api-muzea.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-muzea.su/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # По умолчанию тело маленькое: анонимный POST с гигабайтным телом не должен
    # буферизоваться на диск до проверки авторизации. Большие лимиты — только
    # для конкретных загрузчиков ниже.
    client_max_body_size 1m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # X-Forwarded-For всегда перезаписываем адресом TCP-соединения. Иначе
    # клиент подставляет свой заголовок, а приложение доверяет первому значению
    # и rate-limit можно обойти. CDN перед нами нет; при его появлении здесь
    # нужно настроить real_ip с доверенными адресами.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Картинки новостей (multipart).
    location = /api/news {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
    }

    # Legacy multipart-загрузка видео: единственное большое тело.
    location = /api/videos/upload {
        client_max_body_size 2000m;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Долгий стриминг legacy-видео.
    location /api/videos/stream/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
    }
}
