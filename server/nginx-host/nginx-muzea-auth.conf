# muzea: сервис аутентификации (auth, 8087)
server {
    server_name auth.muzea.su;

    # Auth принимает только небольшие JSON-запросы.
    client_max_body_size 1m;
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;

    # Первый элемент X-Forwarded-For должен быть реальным IP клиента, а не
    # присланным им заголовком: иначе IP rate-limit обходится подменой.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auth.muzea.su/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.muzea.su/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = auth.muzea.su) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name auth.muzea.su;
    return 404; # managed by Certbot


}
