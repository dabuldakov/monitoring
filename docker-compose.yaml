name: monitoring

# Постоянный стек наблюдаемости: метрики + логи + алерты + Grafana.
# Живёт на отдельной машине и НЕ зависит от нагрузочных прогонов (репозиторий loadtest).
# Наружу торчит только Grafana (адрес и порт задаются в .env).
#
# Все IP/порты берутся из .env: конфиг Prometheus рендерится из шаблона
# prometheus/prometheus.yml.tmpl командой ./run.sh render (см. run.sh).
#
# node_exporter на целевых серверах слушает только 127.0.0.1:9100 и пробрасывается
# SSH-туннелями с этой машины на локальные порты из .env:
#   ${AKM_NODE_EXPORTER_PORT}  -> akm-сервер        (server/tunnels/akm.service)
#   ${APPS_NODE_EXPORTER_PORT} -> сервер приложений  (server/tunnels/apps.service)
#
# restart: always (а не unless-stopped): после ребута docker восстановил не все
# контейнеры — prometheus и alertmanager остались лежать, потому что unless-stopped
# не поднимает контейнер, оставшийся «остановленным». always поднимает их и после
# ребута, и при падении/SIGHUP. Автозапуск дублирует systemd-юнит
# server/monitoring-stack.service.

services:
  prometheus:
    image: prom/prometheus:latest
    restart: always
    network_mode: host
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    command:
      - --config.file=/etc/prometheus/prometheus.local.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --query.timeout=30s
      - --query.max-concurrency=4
      - --query.max-samples=10000000
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --web.listen-address=127.0.0.1:9090
    volumes:
      # Монтируем каталог, а не отдельные файлы: при git pull / render файл
      # заменяется (новый inode), и контейнер с file-mount не видит изменения
      # до пересоздания. С каталогом SIGHUP/перечитывание работают.
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    network_mode: host
    mem_limit: 96m
    command:
      - --config.file=/etc/alertmanager/alertmanager.local.yml
      - --web.listen-address=127.0.0.1:9093
      - --storage.path=/alertmanager
    volumes:
      # Каталог, а не файл: см. комментарий у prometheus.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    depends_on:
      - prometheus

  # RTT и потери до целевых серверов (ICMP + TCP), плюс живость приложений
  # по /actuator/health. Слушает только localhost.
  blackbox:
    image: prom/blackbox-exporter:latest
    restart: always
    network_mode: host
    mem_limit: 64m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    depends_on:
      - prometheus

  # Хранилище логов всех docker-контейнеров (agent'ы promtail стоят на серверах
  # приложений и шлют сюда). Наружу не торчит: Grafana читает локально.
  loki:
    image: grafana/loki:3.4.2
    restart: always
    network_mode: host
    user: "0"
    mem_limit: 512m
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    restart: always
    network_mode: host
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_HTTP_ADDR: ${GRAFANA_BIND_ADDR:-127.0.0.1}
      GF_SERVER_HTTP_PORT: "${GRAFANA_PORT:-3000}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  # Имена томов зафиксированы: стек переехал сюда из репозитория loadtest,
  # где тома назывались loadtest_*. Явные name сохраняют историю метрик
  # и логов при переезде — не переименовывай их без нужды.
  prometheus_data:
    name: loadtest_prometheus_data
  alertmanager_data:
    name: loadtest_alertmanager_data
  loki_data:
    name: loadtest_loki-data
  grafana_data:
    name: loadtest_grafana_data
