groups:
  - name: backend-availability
    rules:
      # В аннотациях $labels.server — отображаемое имя сервера (см. .env:
      # APPS_SERVER_NAME и т.д.), а $labels.instance — технический адрес.
      # В письме имя сервера подставляет Alertmanager в тему, здесь оно нужно
      # в теле, чтобы при пересылке письма было понятно, что именно сломалось.

      # Приложение не отвечает на /actuator/health (или БД недоступна -> 503)
      - alert: BackendHealthDown
        expr: probe_success{job="blackbox-http-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервер {{ $labels.server }}: приложение {{ $labels.app }} недоступно"
          description: "На сервере «{{ $labels.server }}» приложение {{ $labels.app }} не проходит health-check ({{ $labels.instance }}) больше 1 минуты: нет HTTP 200 на /actuator/health."

      # Порт приложения не принимает соединения
      - alert: BackendPortDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервер {{ $labels.server }}: порт приложения {{ $labels.app }} не отвечает"
          description: "На сервере «{{ $labels.server }}» TCP-соединение к порту приложения {{ $labels.app }} ({{ $labels.instance }}) не устанавливается больше 1 минуты."

      # Хост сервера не пингуется
      - alert: ServerHostDown
        expr: probe_success{job="blackbox-icmp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Сервер {{ $labels.server }} не отвечает"
          description: "Сервер «{{ $labels.server }}» ({{ $labels.instance }}) не проходит ICMP-пинг больше 2 минут. Проверить: питание, сеть, ssh-туннель до node_exporter."

      # Высокий RTT до сервера (не критично, но полезно)
      - alert: ServerHighLatency
        expr: probe_duration_seconds{job="blackbox-icmp"} > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Сервер {{ $labels.server }}: высокая задержка"
          description: "RTT до сервера «{{ $labels.server }}» ({{ $labels.instance }}) больше 200ms уже 5 минут (сейчас {{ $value | humanizeDuration }})."

  - name: minio
    rules:
      # Хранилище не отвечает на метрики (упал или порван туннель).
      - alert: MinioDown
        expr: up{job="minio"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Сервер {{ $labels.server }}: MinIO недоступен"
          description: "Метрики MinIO ({{ $labels.instance }}) не снимаются больше 2 минут. Проверить контейнер shared-minio и ssh-туннель 127.0.0.1:9103."

      # Свободного места на хранилище мало.
      - alert: MinioDiskSpaceLow
        expr: minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MinIO: мало свободного места ({{ $value | humanizePercentage }})"
          description: "Свободно {{ $value | humanizePercentage }} от usable-объёма MinIO дольше 10 минут. Очистить старые объекты или расширить диск."

      # Совсем мало места — загрузки могут начать падать.
      - alert: MinioDiskSpaceCritical
        expr: minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MinIO: критически мало места ({{ $value | humanizePercentage }})"
          description: "Свободно менее 5% usable-объёма MinIO дольше 5 минут. Загрузки видео/картинок могут начать падать (503 SlowDown)."

# Статус trading-сервера: контейнеры и сессии. Метрики пишет агент
# server/trading-status/collect.sh через textfile-коллектор node_exporter.
  - name: trading-status
    rules:
      # Критичные контейнеры (label required="true"): остановлены или исчезли.
      - alert: TradingContainerDown
        expr: trading_container_up{required="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Trading: контейнер {{ $labels.name }} не работает"
          description: "Контейнер {{ $labels.name }} (роль {{ $labels.role }}, сервер «{{ $labels.instance }}») отсутствует или остановлен больше 2 минут."

      # Опциональные трейдеры: задачи не крутятся (например, пропали, как
      # trades-bot/dn/bot-api/bcs-bot). Если пускать не планируется — убери
      # имя из EXPECTED в server/trading-status/collect.sh.
      - alert: TradingTraderStopped
        expr: trading_container_up{required="false", role="trader"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Trading: трейдер {{ $labels.name }} не запущен"
          description: "Трейдер {{ $labels.name }} на сервере «{{ $labels.instance }}» не запущен больше 15 минут (задуманный простой — убери его из EXPECTED в collect.sh)."

      # Агент статуса перестал писать метрики — значит либо node_exporter
      # упал, либо таймер коллектора не работает.
      - alert: TradingStatusCollectorStale
        expr: absent(trading_container_up{required="true"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Trading: нет метрик статуса"
          description: "Метрики trading_container_up отсутствуют больше 10 минут. Проверить node_exporter (127.0.0.1:9100) и таймер trading-status-collector."
